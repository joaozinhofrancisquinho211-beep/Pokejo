<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pokejo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
:root{--bg:#070b14;--pn:#0f1830;--p2:#17244a;--ln:#23325a;--rd:#e63946;--ye:#ffcb05;--tx:#eaf0ff;--mu:#8e9bbd;color-scheme:dark;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;display:flex;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.n{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;margin:0;line-height:1.2}
h1{font-size:30px}h3{font-size:17px;margin-bottom:8px}p{margin:4px 0}.mu{color:var(--mu)}.sec{margin:20px 0 10px}
:focus-visible{outline:2px solid var(--ye);outline-offset:2px}
nav{width:216px;flex:none;position:sticky;top:0;height:100vh;padding:20px 12px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(#0c1530,var(--bg));border-right:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 18px}.logo h2{color:var(--ye);font-size:26px}
.ball{width:28px;height:28px;border-radius:50%;border:2px solid #000;background:linear-gradient(var(--bt,var(--rd)) 45%,#000 45% 55%,#f4f6fb 55%);position:relative;flex:none}
.ball:after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--ye);border:2px solid #000}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--mu);text-decoration:none;font-weight:600;transition:.2s}
nav a:hover{background:var(--p2);color:var(--tx)}nav a.on{background:var(--p2);color:var(--ye);box-shadow:inset 3px 0 var(--rd)}
main{flex:1;min-width:0;max-width:1180px;padding:26px clamp(14px,3vw,36px) 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:16px}
.g{display:grid;gap:14px;margin-bottom:14px}
.st{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.pks{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.dxg{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.fg{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.kv{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin:12px 0}
.s{display:grid}.s .n{font-size:34px;color:var(--ye);line-height:1}
.rg{display:flex;align-items:center;gap:16px}.rw{display:flex;justify-content:space-between;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.bar i{height:10px;border-radius:9px;background:var(--p2);overflow:hidden}.bar em{display:block;height:100%;border-radius:9px;transition:width .6s}.bar b{min-width:24px;text-align:right}
.pk{position:relative;cursor:pointer;transition:transform .2s,border-color .2s}.pk:hover{transform:translateY(-3px);border-color:var(--ye)}
.star{position:absolute;top:10px;right:14px;color:var(--ye);font-style:normal;z-index:1}
.art{height:112px;display:grid;place-items:center;position:relative;border-radius:14px;margin-bottom:8px;background:radial-gradient(circle,#1f2f62,transparent 70%)}
.art b{position:absolute;font:800 24px "Baloo 2",sans-serif;color:#ffffff30}.art img{position:relative;height:100%;max-width:100%;object-fit:contain}
.mb{height:6px;border-radius:9px;background:var(--p2);margin:6px 0 8px;overflow:hidden}.mb em{display:block;height:100%;background:var(--ye)}
.t,.f{display:inline-block;margin:2px 4px 2px 0;padding:0 9px;border-radius:99px;font-size:12px;font-weight:700}.t{color:#111}.f{border:1px solid var(--ye);color:var(--ye)}
.dx{display:grid;gap:2px;padding:12px;cursor:pointer;opacity:.55;transition:.2s}.dx.ok{opacity:1;border-color:var(--ye)}.dx:hover{opacity:1}.dx b{color:var(--mu)}.dx em{font-size:12px;font-style:normal;color:var(--ye)}.dx em.mu{color:var(--mu)}
.fil{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.kv div{background:var(--bg);padding:8px 10px;border-radius:12px;display:grid}.kv b{font:800 18px "Baloo 2",sans-serif}
.empty{grid-column:1/-1;text-align:center;padding:28px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;font:inherit}
label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
.cks{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.ck{display:inline-flex;grid-template-columns:none;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--ln);border-radius:99px;cursor:pointer;color:var(--tx);font-size:13px}
.ck input{width:auto}.ck:has(input:checked){background:var(--ye);color:#111;border-color:var(--ye)}
.b{border:0;border-radius:12px;padding:10px 16px;font:700 14px system-ui,sans-serif;cursor:pointer;background:var(--p2);color:var(--tx);transition:.2s}.b:hover{filter:brightness(1.25)}.b.p{background:var(--rd)}.b.y{background:var(--ye);color:#111}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}.er{color:#ff8a93;min-height:22px;font-weight:600}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:22px;padding:20px;width:min(560px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:#000b;backdrop-filter:blur(3px)}dialog[open]{animation:up .25s}
#t{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:99}
.toast{padding:12px 16px;border-radius:12px;background:#10361f;border:1px solid #2f9e5b;animation:up .25s}.toast.err{background:#3b1119;border-color:var(--rd)}
@keyframes up{from{opacity:0;transform:translateY(12px)}}.gm{display:grid;gap:4px}.gi{font-size:34px;line-height:1}.gb{position:absolute;top:8px;left:12px;font-style:normal;z-index:1}.av{width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--rd);color:#fff;font:800 26px "Baloo 2",sans-serif}[hidden]{display:none!important}.pf{color:#4ade80}.ls{color:#ff8a93}.md{display:grid;gap:2px;opacity:.5}.md.ok{opacity:1;border-color:var(--ye)}.gate{max-width:420px;margin:10vh auto;padding:28px;text-align:center;display:grid;gap:12px;justify-items:center}.gate label,.gate .b{width:100%}.gate label{text-align:left}.av{position:relative;overflow:hidden}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.trn{display:grid;gap:4px;justify-items:center;padding:12px;border:2px solid transparent}.trn.on{border-color:var(--ye)}.th{width:64px;height:64px;justify-self:center;image-rendering:pixelated}.dx:not(.ok) .th{filter:grayscale(1) brightness(.5)}
@media(max-width:760px){body{display:block}nav{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;justify-content:space-around;gap:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:50;border-right:0;border-top:1px solid var(--ln);background:var(--bg)}
.logo{display:none}nav a{flex-direction:column;gap:0;font-size:10px;padding:6px 2px;flex:1;min-width:0;text-align:center}main{padding-bottom:96px}#t{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
